# Checks the case study reference on every push that changes them, so they can't quietly break.
# The same checks run on your machine with: python3 tools/check_examples.py
name: Case study reference

on:
  push:
    paths:
      - "case-study-reference/**"
      - "tools/check_examples.py"
      - "tools/check_asyncapi.mjs"
      - "package-lock.json"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "case-study-reference/**"
      - "tools/check_examples.py"
      - "tools/check_asyncapi.mjs"
      - "package-lock.json"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Every example, with real Terraform, PostgreSQL, and a browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install the checkers
        run: |
          python -m pip install --upgrade pip
          pip install "python-hcl2>=7" ansible ansible-lint cfn-lint graphql-core openapi-spec-validator playwright
          pip install -r case-study-reference/code/server/requirements.txt
          ansible-galaxy collection install -r case-study-reference/infrastructure/ansible/requirements.yml
          python -m playwright install --with-deps chromium
          npm ci

      - name: Check every example
        run: python tools/check_examples.py

  docker:
    name: The Docker image builds and passes its tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with Docker Compose
        working-directory: case-study-reference/code
        run: |
          docker compose build
          docker compose run --rm api python -m pytest -q

      - name: The server answers from the container
        working-directory: case-study-reference/code
        run: |
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/demo > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer homeowner-token" http://localhost:8000/api/contractors
          docker compose down
