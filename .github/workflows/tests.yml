name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install tools
        run: |
          python -m pip install --upgrade ruff python-docx
          npm ci

      - name: Skill checks (names, descriptions, wording, links)
        run: python tools/check_skills.py

      - name: Plugin catalog matches the skills folder
        run: python tools/build_catalog.py --check

      - name: Plugin catalog is valid for Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .

      - name: Lint Python
        run: ruff check .

      - name: Lint JavaScript and Apps Script
        run: npx eslint .

      - name: Lint Markdown
        run: npx markdownlint-cli2 "**/*.md"

      - name: Editor tools for Google Docs (against a stand-in for Google Docs)
        run: node skills/editor/tests/google-docs.test.cjs

      - name: Editor tools for Markdown
        run: python -m unittest discover --start-directory skills/editor/tests --pattern "test_*.py" --verbose

      - name: Release ZIPs build
        run: python tools/build_release.py

  oldest-python:
    # macOS still ships Python 3.9, so the scripts authors run must work on it. GitHub's newest
    # runners no longer offer 3.9 through setup-python, so uv installs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Scripts run on Python 3.9
        run: |
          uv python install 3.9
          python_39="$(uv python find 3.9)"
          "$python_39" -m compileall -q tools skills/editor/scripts skills/editor/evals/tools
          "$python_39" tools/check_skills.py
          "$python_39" tools/build_catalog.py --check
          "$python_39" tools/run_evals.py --dry-run
          "$python_39" -m unittest discover --start-directory skills/editor/tests --pattern "test_*.py"
