# Runs the example server and a PostgreSQL with the schema and seed data loaded. From this folder:
#   docker compose up                               the server, then open http://localhost:8000/demo
#   docker compose run --rm api python -m pytest    every test, database ones included
#   docker compose exec database psql -U postgres -d renovation -f /queries.sql
#
# For your own machine only: the ports are open to localhost alone, and the database trusts every
# connection instead of asking for a password, so no password has to live in this file.

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:50051:50051"
    environment:
      DATABASE_URL: postgresql://postgres@database:5432/postgres
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18
    environment:
      POSTGRES_DB: renovation
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Files here run once, in name order, the first time the database starts
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/queries.sql:/queries.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "renovation"]
      interval: 2s
      timeout: 3s
      retries: 15
